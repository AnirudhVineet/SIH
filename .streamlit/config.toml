[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#16161a"
secondaryBackgroundColor = "#1e1e24"
textColor = "#f2f2ef"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# "auto" only hides the Deploy button on Streamlit Community Cloud -- it has
# no way to detect a Docker/HF Spaces deployment, so without this the Deploy
# button and hamburger menu would still show in front of the judges.
toolbarMode = "minimal"
